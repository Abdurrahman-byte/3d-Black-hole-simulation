<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRRT Black Hole Renderer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hint">drag: orbit &nbsp;|&nbsp; wheel/pinch: zoom</div>
<div id="ui">
  <b>Schwarzschild / Kerr Ray Tracer</b>
  <div class="row">Mass (r_s)<input id="rs" type="range" min="0.4" max="2.0" step="0.01" value="1.0"></div>
  <div class="row">Spin (frame-drag)<input id="spin" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <div class="row">Disk speed<input id="spd" type="range" min="0" max="2" step="0.05" value="1.0"></div>
</div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
